<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Nadar por la gloria · B</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body class="b">
<canvas id="cv"></canvas>
<div id="pad"></div>
<div id="scr"></div>
<div id="rot">Girá el celu 🔄<br>Se juega acostado.</div>
<script src="comun.js"></script>
<script>
// Prototipo B: cámara detrás del nadador, con profundidad falsa, tipo Road Rash.
const PW = 8;          // ancho de la pileta en metros
const CAM_BACK = 3.2;  // la cámara va 3,2 m detrás del jugador
const CAM_H = 1.4;     // altura de la cámara
let camWx = 0;

function render(ctx, race, W, H) {
  const hy = H * 0.36, f = H * 0.9;
  const p = race ? race.racers[0] : { x: 0, u: 0.5 };
  const t = race ? race.t : performance.now() / 1000;
  const camZ = p.x - CAM_BACK;
  camWx += ((p.u - 0.5) * PW * 0.9 - camWx) * 0.12;
  const proj = (wx, z) => ({ x: W / 2 + (wx - camWx) * f / z, y: hy + CAM_H * f / z, s: f / z });
  const zNear = CAM_H * f / (H - hy) - 0.05;

  // tribuna y techo del natatorio
  const sky = ctx.createLinearGradient(0, 0, 0, hy);
  sky.addColorStop(0, "#C9DDEA"); sky.addColorStop(1, "#EEF4F7"); ctx.fillStyle = sky; ctx.fillRect(0, 0, W, hy);
  ctx.fillStyle = "#7E93A6"; ctx.fillRect(0, hy - H * 0.07, W, H * 0.07);
  for (let i = 0; i < 40; i++) { ctx.fillStyle = ["#D23B3B", "#FFD84A", "#2F6FE0", "#fff"][i % 4]; ctx.fillRect((i * 37 + 11) % W, hy - H * 0.06 + (i % 3) * 7, 6, 6); }
  // piso del borde
  ctx.fillStyle = "#D9CDB4"; ctx.fillRect(0, hy, W, H - hy);

  // agua, por franjas de 1 m (dan la sensación de velocidad)
  for (let m = Math.floor(camZ + zNear); m < camZ + 70; m++) {
    const z1 = Math.max(zNear, m - camZ), z2 = m + 1 - camZ; if (z2 <= zNear) continue;
    const a = proj(-PW / 2, z1), b = proj(PW / 2, z1), c = proj(PW / 2, z2), d = proj(-PW / 2, z2);
    ctx.fillStyle = m % 2 ? "#2F9BDA" : "#3AA8E4";
    if (m % 10 === 0 && m > 0 && m < RACE_M) ctx.fillStyle = "#6CC4F0";
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y); ctx.lineTo(d.x, d.y); ctx.fill();
    // borde de la pileta
    ctx.fillStyle = m % 2 ? "#C9BDA4" : "#D9CDB4";
    const e1 = proj(-PW / 2 - 1.2, z1), e2 = proj(-PW / 2 - 1.2, z2), e3 = proj(PW / 2 + 1.2, z1), e4 = proj(PW / 2 + 1.2, z2);
    ctx.beginPath(); ctx.moveTo(e1.x, e1.y); ctx.lineTo(a.x, a.y); ctx.lineTo(d.x, d.y); ctx.lineTo(e2.x, e2.y); ctx.fill();
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(e3.x, e3.y); ctx.lineTo(e4.x, e4.y); ctx.lineTo(c.x, c.y); ctx.fill();
    // llegada a cuadros
    if (m === RACE_M) for (let k = 0; k < 16; k++) {
      const q1 = proj(-PW / 2 + k * PW / 16, z1), q2 = proj(-PW / 2 + (k + 1) * PW / 16, z1), q3 = proj(-PW / 2 + (k + 1) * PW / 16, z1 + 0.5), q4 = proj(-PW / 2 + k * PW / 16, z1 + 0.5);
      ctx.fillStyle = k % 2 ? "#111" : "#fff";
      ctx.beginPath(); ctx.moveTo(q1.x, q1.y); ctx.lineTo(q2.x, q2.y); ctx.lineTo(q3.x, q3.y); ctx.lineTo(q4.x, q4.y); ctx.fill();
    }
  }
  // líneas del fondo
  ctx.fillStyle = "rgba(10,30,60,0.3)";
  for (const u of [1 / 6, 0.5, 5 / 6]) {
    const wx = (u - 0.5) * PW, a = proj(wx - 0.12, zNear), b = proj(wx + 0.12, zNear), c = proj(wx + 0.12, 70), d = proj(wx - 0.12, 70);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y); ctx.lineTo(d.x, d.y); ctx.fill();
  }

  // todo lo que flota, de lejos a cerca
  const items = [];
  for (const u of [1 / 3, 2 / 3]) for (let m = Math.ceil((camZ + zNear) * 2) / 2; m < camZ + 40; m += 0.5) items.push({ z: m - camZ, kind: "boya", u, m });
  if (race) {
    for (const o of race.objs) if (!o.gone && o.x - camZ > zNear && o.x - camZ < 60) items.push({ z: o.x - camZ, kind: o.kind, u: o.u, o });
    for (const r of race.racers) if (r.x - camZ > 1.2) items.push({ z: r.x - camZ, kind: "nadador", u: r.u, r });
  }
  items.sort((a, b) => b.z - a.z);
  for (const it of items) {
    const pt = proj((it.u - 0.5) * PW, it.z);
    if (pt.x < -200 || pt.x > W + 200) continue;
    if (it.kind === "boya") { ctx.fillStyle = Math.round(it.m * 2) % 2 ? "#EEE" : "#D23B3B"; ctx.beginPath(); ctx.ellipse(pt.x, pt.y, 0.09 * pt.s, 0.06 * pt.s, 0, 0, 7); ctx.fill(); }
    else if (it.kind === "milanga") drawMilanga(ctx, pt.x, pt.y - 0.1 * pt.s + Math.sin(t * 3 + it.o.x) * 0.03 * pt.s, 0.3 * pt.s);
    else if (it.kind === "churro") {
      ctx.save(); ctx.translate(pt.x, pt.y); ctx.rotate(Math.PI / 2);
      drawChurro(ctx, 0, 0, 0.13 * PW * pt.s, 0.22 * pt.s, ["#FF6FB0", "#7CFC6A", "#FFB030"][Math.floor(it.o.x) % 3]); ctx.restore();
    } else drawSwimmerBack(ctx, it.r, pt, t, race);
  }
  if (!race) return;
  // rivales que quedaron detrás de la cámara
  ctx.font = "bold 12px system-ui, sans-serif"; ctx.textAlign = "center";
  for (const r of race.racers) {
    if (r.isPlayer || r.x - camZ > 1.2 || r.finished) continue;
    const pt = proj((r.u - 0.5) * PW, 2.5), x = clamp(pt.x, 40, W - 40);
    const txt = "▼ " + r.ch.name + " " + Math.ceil(p.x - r.x) + " m";
    ctx.fillStyle = "#0008"; ctx.fillRect(x - 46, H * 0.52, 92, 18);
    ctx.fillStyle = "#fff"; ctx.fillText(txt, x, H * 0.52 + 13);
  }
}

function drawSwimmerBack(ctx, r, pt, t, race) {
  const s = 0.85 * pt.s, ch = r.ch, x = pt.x, y = pt.y;
  ctx.save();
  if (r.dive) ctx.globalAlpha = 0.3;
  else if (r.immune > 0 && Math.floor(t * 10) % 2) ctx.globalAlpha = 0.6;
  if (r.boat) {
    ctx.fillStyle = "#8B5A2B"; ctx.strokeStyle = "#5A3A1A"; ctx.lineWidth = Math.max(1, s * 0.03);
    ctx.beginPath(); ctx.moveTo(x - s * 0.6, y - s * 0.35); ctx.lineTo(x + s * 0.6, y - s * 0.35); ctx.lineTo(x + s * 0.45, y + s * 0.05); ctx.lineTo(x - s * 0.45, y + s * 0.05); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.moveTo(x, y - s * 1.1); ctx.lineTo(x + s * 0.4, y - s * 0.4); ctx.lineTo(x, y - s * 0.4); ctx.fill();
  }
  // espuma
  ctx.fillStyle = "rgba(255,255,255,0.75)";
  ctx.beginPath(); ctx.ellipse(x, y, s * 0.55, s * 0.12, 0, 0, 7); ctx.fill();
  const back = r.plancha > 0;
  // espalda y cabeza
  ctx.fillStyle = ch.suit; ctx.beginPath(); ctx.ellipse(x, y - s * 0.05, s * 0.3, s * 0.11, 0, Math.PI, 0); ctx.fill();
  ctx.fillStyle = ch.cap; ctx.beginPath(); ctx.arc(x, y - s * (back ? 0.08 : 0.2), s * 0.15, 0, 7); ctx.fill();
  ctx.strokeStyle = r.isPlayer ? "#FFD84A" : "#fff"; ctx.lineWidth = Math.max(1, s * 0.025); ctx.stroke();
  // brazos
  const still = r.stun || r.eat || r.drown || back;
  const ph = still ? 0 : t * (r.hold ? 7 : 4) + r.x;
  ctx.strokeStyle = ch.skin; ctx.lineCap = "round"; ctx.lineWidth = Math.max(2, s * 0.09);
  for (const side of [-1, 1]) {
    const up = still ? (r.drown ? 1 : 0) : Math.max(0, Math.sin(ph + (side > 0 ? Math.PI : 0)));
    ctx.beginPath(); ctx.moveTo(x + side * s * 0.22, y - s * 0.12);
    ctx.quadraticCurveTo(x + side * s * 0.42, y - s * (0.2 + 0.5 * up), x + side * s * 0.3, y - s * (0.1 + 0.6 * up)); ctx.stroke();
  }
  const sl = race && race.fx.find((f) => f.kind === "slap" && f.r === r);
  if (sl) { // manotazo hacia los dos costados
    ctx.strokeStyle = "#fff"; ctx.lineWidth = Math.max(2, s * 0.05);
    for (const side of [-1, 1]) { ctx.beginPath(); ctx.arc(x + side * s * 0.4, y - s * 0.2, s * 0.35, side > 0 ? -1 : Math.PI - 0.6, side > 0 ? 0.6 : Math.PI + 1); ctx.stroke(); }
  }
  ctx.restore();
  // nombre, estados, globito
  const fs = clamp(s * 0.16, 9, 14);
  ctx.save(); ctx.font = `bold ${fs}px system-ui, sans-serif`; ctx.textAlign = "center";
  ctx.fillStyle = r.isPlayer ? "#FFD84A" : "#fff"; ctx.strokeStyle = "#0008"; ctx.lineWidth = 3;
  const label = r.isPlayer ? "VOS" : ch.name;
  ctx.strokeText(label, x, y - s * 0.45); ctx.fillText(label, x, y - s * 0.45);
  if (r.stun) { ctx.fillStyle = "#FFD84A"; for (let i = 0; i < 3; i++) { const a = t * 6 + i * 2.1; ctx.beginPath(); ctx.arc(x + Math.cos(a) * s * 0.25, y - s * 0.38 + Math.sin(a) * s * 0.06, Math.max(2, s * 0.04), 0, 7); ctx.fill(); } }
  if (r.eat) drawMilanga(ctx, x + s * 0.3, y - s * 0.35, s * 0.1);
  ctx.restore();
  if (r.bubble) drawBubble(ctx, x, y - s * 0.55 - fs, r.bubble.text, clamp(s * 0.15, 10, 14));
}

startApp({
  title: "NADAR POR LA GLORIA", subtitle: "Prototipo B · cámara detrás del nadador",
  slaps: true, render,
  help: "Mantené NADAR para ir a fondo (gasta aire; soltá para respirar). ◀▶ para moverte. Con MANOTAZO frenás al que tengas al lado (y ellos a vos). Las milanesas te dan tu ESPECIAL. En compu: flechas, espacio, Z y X.",
  buttons: [
    { cls: "dir1", label: "◀", hold: "left" }, { cls: "dir2", label: "▶", hold: "right" },
    { cls: "sp", id: "bsp", label: "ESPECIAL", press: "specialPressed" }, { cls: "slap", label: "MANO-\nTAZO", press: "slapPressed" },
    { cls: "swim", label: "NADAR", hold: "swim" }
  ]
});
</script>
</body>
</html>
